name: release-and-publish

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keep-release-and-publish
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  publish:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
