name: release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Read and validate release version
        id: release
        run: |
          version="$(./gradlew -q properties --property version --no-daemon | sed -n 's/^version: //p')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Gradle project version must be semantic version text without a v prefix; found: $version" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Pull integration test images
        timeout-minutes: 5
        run: |
          # Avoid Docker Hub authentication outages during Testcontainers startup.
          for image in testcontainers/ryuk:0.12.0 library/postgres:16-alpine library/postgres:17-alpine; do
            docker pull "mirror.gcr.io/$image"
            docker tag "mirror.gcr.io/$image" "${image#library/}"
          done

      - name: Run tests
        timeout-minutes: 10
        run: |
          cat > "$RUNNER_TEMP/keep-test-logging.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events "started", "passed", "skipped", "failed"
                      exceptionFormat "full"
                  }
              }
          }
          EOF
          ./gradlew test --no-daemon --init-script "$RUNNER_TEMP/keep-test-logging.gradle"

      - name: Remove existing release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git push origin --delete "refs/tags/$RELEASE_TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Trigger and verify JitPack release
        timeout-minutes: 15
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          repository_owner="${GITHUB_REPOSITORY%%/*}"
          repository_name="${GITHUB_REPOSITORY#*/}"
          pom_url="https://jitpack.io/com/github/${repository_owner}/${repository_name}/${RELEASE_TAG}/${repository_name}-${RELEASE_TAG}.pom"

          deadline=$((SECONDS + 840))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            echo "Requesting JitPack artifact (attempt ${attempt}): ${pom_url}"
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 60 \
              --output /dev/null \
              "$pom_url"; then
              echo "JitPack release ${RELEASE_TAG} is available."
              exit 0
            fi

            sleep 15
          done

          echo "JitPack did not publish ${RELEASE_TAG} within the allowed time." >&2
          echo "Build log: https://jitpack.io/com/github/${repository_owner}/${repository_name}/${RELEASE_TAG}/build.log" >&2
          exit 1
